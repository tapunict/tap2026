services:
  fluentd:
    build: ../../fluentd
    hostname: fluentd
    container_name: fluentd
    command: "-c /fluentd/etc/bluetap.conf"
    volumes:
      - ../../fluentd/conf:/fluentd/etc
    ports:
      - "5000:5000"
    depends_on:
      topics:
        condition: service_completed_successfully
  blueskyscraper:
    build: ../../python
    hostname: blueskyscraper
    container_name: blueskyscraper
    env_file: ".env"
    volumes:
      - ../../python/bin/:/usr/src/app/bin
    depends_on:
      - fluentd
      
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://broker:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  topics:
    image: apache/kafka:latest
    hostname: topics
    container_name: topics
    command: > 
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --create --topic bluetap --bootstrap-server broker:9092
      "
    depends_on:
      - broker
    # - elasticsearch # Commment before sending the data using spark
      - elasticsearch 
  spark:
    image: tap:spark
    hostname: spark
    container_name: spark
    volumes:
      - ../../spark/code/:/opt/tap/
      - sparklibs:/tmp/.ivy2
    command: > 
      /opt/spark/bin/spark-submit --conf spark.driver.extraJavaOptions="-Divy.cache.dir=/tmp -Divy.home=/tmp" --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.16.2  /opt/tap/bluetap.py
    depends_on:
      topics:
        condition: service_completed_successfully
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    mem_limit: 1 GB
  kibana:
    hostname: kibana
    image: docker.elastic.co/kibana/kibana:8.16.2
    ports:
      - 5601:5601
    volumes:
      - ../../kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    depends_on:
      - elasticsearch
volumes:
  sparklibs:
